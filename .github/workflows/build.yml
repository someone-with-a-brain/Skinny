name: Build Skinny WASM Plugin

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile WASM Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build plugin (Release)
        run: cargo build --release

      - name: Upload compiled WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: skinny_pumpkin.wasm
          path: target/wasm32-wasip2/release/skinny_pumpkin.wasm

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: skinny_pumpkin.wasm

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: skinny_pumpkin.wasm


name: Build Skinny WASM Plugin

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile WASM Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build plugin (Release)
        run: cargo build --release --target wasm32-wasip2

      - name: Upload compiled WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: skinny_pumpkin.wasm
          path: target/wasm32-wasip2/release/skinny_pumpkin.wasm

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: skinny_pumpkin.wasm

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Skinny v1.0.0 Release
          body: |
            ## 🎃 Skinny v1.0.0 WASM Plugin Release
            
            Native PumpkinMC world chunk pre-generator compiled binary (`skinny_pumpkin.wasm`).
            
            ### Quick Install:
            1. Download `skinny_pumpkin.wasm` from this release.
            2. Place `skinny_pumpkin.wasm` into your PumpkinMC server's `plugins/` directory.
          draft: false
          prerelease: false
          files: skinny_pumpkin.wasm
